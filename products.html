<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>भाजीपाला | आपला शेतकरी</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            background:#f5f5f5;
        }

        header{
            background:#198754;
            color:white;
            padding:20px;
            text-align:center;
        }

        nav{
            margin-top:10px;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin:0 15px;
            font-weight:bold;
        }

        .products{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
            gap:20px;
            padding:30px;
        }

        .card{
            background:white;
            border-radius:15px;
            overflow:hidden;
            box-shadow:0 5px 15px rgba(0,0,0,0.1);
            text-align:center;
            padding-bottom:20px;
        }

        .card img{
            width:100%;
            height:220px;
            object-fit:cover;
        }

        .card h3{
            margin:15px 0 10px;
        }

        .card p{
            margin:8px 0;
        }

        .order-btn{
            display:inline-block;
            margin-top:15px;
            padding:12px 20px;
            background:#198754;
            color:white;
            text-decoration:none;
            border-radius:8px;
        }

        .not-available{
            background:#888;
            pointer-events:none;
        }
    </style>
</head>

<body>

<header>

    <h1>🌾 आपला शेतकरी</h1>

    <nav>
        <a href="index.html">मुख्यपृष्ठ</a>
        <a href="products.html">भाजीपाला</a>
    </nav>

</header>

<section class="products" id="productsContainer">

</section>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwXgKn5ybby9qqj996vsCceM7v2I93gQHw8ga3Ev3BRIpGG3f44NWxtfYZWP_l32BlS/exec";

async function loadProducts(){

    try{

        const response = await fetch(API_URL);
        const products = await response.json();

        const container = document.getElementById("productsContainer");

        container.innerHTML = "";

        products.reverse().forEach(product => {

            const available = product.Status === "Available";

            container.innerHTML += `

                <div class="card">

                    <img src="${product.Image}" alt="${product.Name}">

                    <h3>${product.Name}</h3>

                    <p><strong>₹${product.Price} / kg</strong></p>

                    <p style="color:${available ? 'green' : 'red'};font-weight:bold;">

                        ${available ? '✅ Available' : '❌ Out Of Stock'}

                    </p>

                    <a
                        class="order-btn ${available ? '' : 'not-available'}"
                        href="https://wa.me/919309295969?text=मला ${product.Name} ऑर्डर करायची आहे"
                        target="_blank">

                        WhatsApp वर ऑर्डर करा

                    </a>

                </div>

            `;

        });

    }catch(error){

        console.error(error);
        alert("Products लोड झाले नाहीत.");

    }

}

loadProducts();

</script>

</body>
</html>
